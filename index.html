<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UsersCx</title>

<link rel="stylesheet" href="style.css">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#ffffff">
</head>
<body>

<div class="container">
    <h1>Cadastro de Usuários</h1>

    <form class="form-grid" id="form-cadastro">

        <label for="foto">Foto de Perfil</label>
        <input type="file" id="foto" accept="image/*" class="full">
        <img id="preview-foto" src="" alt="Pré-visualização da foto">

        <label for="nome">Nome</label>
        <input type="text" id="nome" placeholder="nome do usuário" class="full">

        <label for="cep">CEP</label>
        <input type="text" id="cep" placeholder="CEP" class="full">

        <label for="endereco">Endereço</label>
        <input type="text" id="endereco" placeholder="endereço" class="full">

        <label for="complemento">Complemento</label>
        <input type="text" id="complemento" placeholder="Complemento de endereço">

        <label for="cidade">Cidade</label>
        <input type="text" id="cidade" placeholder="Cidade">

        <label for="estado">Estado</label>
        <select id="estado" class="full">
            <option value="">Selecione...</option>
            <option value="PE">PE</option>
            <option value="RJ">RJ</option>
            <option value="SP">SP</option>
            <option value="RN">RN</option>
            <option value="RS">RS</option>
        </select>

        <label for="areas">Áreas de Interesse</label>
        <select id="areas" multiple class="full">
            <option value="IA">Inteligência Artificial</option>
            <option value="DD">Datawarehouse & Datamining</option>
            <option value="RC">Rede de Computadores</option>
        </select>

        <label for="obs">Observações</label>
        <textarea class="full" id="obs" placeholder="Texto livre"></textarea>

        <div class="botoes">
        <button type="submit" id="ok">ok</button>
        <button type="button" id="cancelar">cancelar</button>
        </div>
    </form>


</div>

<script src="script.js"></script>
</body>
</html>
